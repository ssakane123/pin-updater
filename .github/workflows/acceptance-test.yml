name: Acceptance test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  acceptance-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # setup-uv does not publish floating major tags, so pin the exact version.
      - uses: astral-sh/setup-uv@v10.3.3

      - name: Install dependencies
        run: uv sync --locked --group dev --python 3.14

      - name: Run acceptance test
        run: uv run --locked python -m behave --no-snippets features
